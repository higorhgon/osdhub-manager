[package]
name = "osdhub-manager"
version = "0.1.0"
edition = "2024"
description = "Manages the games of an OSDHub device from a computer: title IDs, OPL art and ISO names"
repository = "https://github.com/higorhgon/osdhub-manager"

[dependencies]
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde_json = "1.0.151"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["util"] }
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Small static binaries for the releases
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
